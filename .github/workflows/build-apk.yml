# Builds installable APKs on GitHub's runners, on demand only.
#
# This is separate from ci.yml (which only analyzes/tests): it produces the
# actual `flutter build apk` artifact via tooling/build-apk.sh. Run it from the
# Actions tab (Run workflow), or push a tag. The signed-with-debug-key APKs are
# uploaded as artifacts and kept for 14 days.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "arm64 | x64 | all"
        default: arm64
        required: true
      mode:
        description: "release | debug | profile"
        default: release
        required: true
  push:
    tags:
      - "apk-*"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install NDK 28.2.13676358
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "SDK=$SDK"; ls "$SDK" || true
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --install "ndk;28.2.13676358"
          ls "$SDK/ndk" || true
          cat "$SDK/ndk/28.2.13676358/source.properties" || true
          grep -q '^sdk.dir=' app/android/local.properties 2>/dev/null || echo "sdk.dir=$SDK" >> app/android/local.properties
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: |
          cd app
          flutter pub get --enforce-lockfile

      - name: Restore runtime cache
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/out
            runtime/.cache
          key: runtime-${{ github.event.inputs.flavor || 'arm64' }}-${{ hashFiles('runtime/patches/pins.json', 'runtime/tawcroot/source.json', 'runtime/locks/*.json', 'runtime/build-runtime.sh') }}

      - name: Build runtime (rootfs + engine assets)
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'arm64' }}
        run: |
          chmod +x runtime/build-runtime.sh
          case "$FLAVOR" in
            arm64) abi=arm64-v8a ;;
            x64) abi=x86_64 ;;
            all) abi="x86_64 arm64-v8a" ;;
          esac
          # Skip the (slow) rootfs build when this exact runtime is already restored.
          want=""
          [ "$abi" = "x86_64" ] && want="x86_64"
          [ "$abi" = "arm64-v8a" ] && want="arm64-v8a"
          if [ -n "$want" ] && [ -f "runtime/out/$want/assets/runtime/manifest.json" ]; then
            echo "runtime $want already present from cache; skipping build"
          else
            runtime/build-runtime.sh $abi
          fi

      - name: Save runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/out
            runtime/.cache
          key: runtime-${{ github.event.inputs.flavor || 'arm64' }}-${{ hashFiles('runtime/patches/pins.json', 'runtime/tawcroot/source.json', 'runtime/locks/*.json', 'runtime/build-runtime.sh') }}

      - name: Build APK
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'arm64' }}
          MODE: ${{ github.event.inputs.mode || 'release' }}
        run: |
          # Route Gradle plugin resolution through mirrors: on some runners
          # plugins.gradle.org is unreachable (kotlin-stdlib 2.2.21 404s), while
          # the Aliyun mirrors serve the same artifacts.
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              maven { url 'https://maven.aliyun.com/repository/central' }
              maven { url 'https://maven.aliyun.com/repository/google' }
              gradlePluginPortal()
            }
          }
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                maven { url 'https://maven.aliyun.com/repository/central' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                google()
                mavenCentral()
              }
            }
            repositories {
              maven { url 'https://maven.aliyun.com/repository/google' }
              maven { url 'https://maven.aliyun.com/repository/central' }
              google()
              mavenCentral()
            }
          }
          EOF
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh --flavor "$FLAVOR" --"$MODE"
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
